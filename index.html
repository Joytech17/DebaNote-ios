<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DebaNote</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DebaNote">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#e6eef8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1a31" media="(prefers-color-scheme: dark)">
<style>
:root{box-sizing:border-box;padding-top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));padding-bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));
--bg:#e6eef8;--panel:#fff;--ink:#14294b;--mute:#5a6e8d;--line:#d0dbeb;--a:#2a63b8;--b:#b07d12;--btn:#14294b;--btnink:#fff;--warn:#b23a2b;--gold:#d9a826;
--r:22px;--font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a31;--panel:#172a4b;--ink:#eef3fb;--mute:#9db1d0;--line:#2b4570;--a:#80b2f4;--b:#f0c45a;--btn:#f0c45a;--btnink:#0d1a31;--warn:#f09484;--gold:#f0c45a}}
:root[data-theme="dark"]{--bg:#0d1a31;--panel:#172a4b;--ink:#eef3fb;--mute:#9db1d0;--line:#2b4570;--a:#80b2f4;--b:#f0c45a;--btn:#f0c45a;--btnink:#0d1a31;--warn:#f09484;--gold:#f0c45a}
*,*:before,*:after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
button,select,input{touch-action:manipulation}
button:not(:disabled):active{opacity:.7}
html{scroll-padding-top:var(--safe-area-inset-top,env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font)}
main{max-width:520px;margin:0 auto;padding:14px 14px 40px}
header{display:flex;align-items:center;gap:12px;margin:2px 2px 14px}
header img{height:52px;width:auto;flex:none}
h1{font:700 26px/1.1 var(--font);margin:0}
header p{margin:2px 0 0;color:var(--mute);font-size:14px}
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px 14px}
.t0{box-shadow:inset 0 3px 0 0 var(--a)}.t1{box-shadow:inset 0 3px 0 0 var(--b)}
.team input.name:focus{outline:none;background:rgba(128,150,190,.2)}
.team input.name{width:calc(100% + 8px);margin:-4px 0 0 -6px;border:0;background:transparent;color:var(--ink);font:700 16px var(--font);padding:4px 6px 4px 6px;outline-offset:0;border-radius:10px}
.total{font:800 54px/1 var(--font);font-variant-numeric:tabular-nums}
.t0 .total{color:var(--a)}.t1 .total{color:var(--b)}
.bar{height:10px;background:var(--line);border-radius:99px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;transition:width 1s cubic-bezier(.25,.8,.25,1)}
.t0 .bar i{background:var(--a)}.t1 .bar i{background:var(--b)}
.left{color:var(--mute);font-size:13px;margin-top:6px}
.win{margin:12px 0 0;padding:14px;border-radius:var(--r);background:var(--btn);color:var(--btnink);font-weight:700;text-align:center}
.win[hidden]{display:none}
.hang{margin:10px 0 0;padding:10px 14px;border-radius:99px;background:var(--panel);border:2px dashed var(--gold);text-align:center;font-weight:700;font-size:14px}
.hang[hidden]{display:none}
.foot{flex-wrap:wrap}.foot #restore{flex-basis:100%}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg3.two{grid-template-columns:1fr 1fr}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 12px}
.seg4 button{border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:8px 0;font:700 14px var(--font);cursor:pointer}
.seg4 button.on{background:var(--btn);border-color:var(--btn);color:var(--btnink)}
.dd{position:relative}
.dd>button{width:100%;display:flex;justify-content:space-between;align-items:center;font:700 20px var(--font);font-variant-numeric:tabular-nums;padding:11px 14px;border:2px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);cursor:pointer}
.ddl{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:5;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:150px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.ddl[hidden]{display:none}
.ddl button{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:8px 0;font:700 15px var(--font);cursor:pointer}
.ddl button.on{background:var(--btn);border-color:var(--btn);color:var(--btnink)}
:root{--c:#2f8f6b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c:#6fd1a6}}
:root[data-theme="dark"]{--c:#6fd1a6}
.t2{box-shadow:inset 0 3px 0 0 var(--c)}.t2 .total{color:var(--c)}.t2 .bar i{background:var(--c)}
.board.b3{grid-template-columns:repeat(3,1fr);gap:8px}
.b3 .team{padding:10px 8px 12px}
.b3 .total{font-size:34px}
.b3 input.name{font-size:14px;padding-right:0}
.b3 .left{font-size:12px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cols3 label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cols3 input.num{padding:10px 6px;font-size:18px;text-align:center}
.seg3 button{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:6px;padding-right:6px}
.seg3 button:disabled{opacity:.5;cursor:default}
.seg4.two{grid-template-columns:1fr 1fr}
#coa{cursor:default;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-drag:none}
.push{position:fixed;left:10px;right:10px;top:calc(var(--safe-area-inset-top,env(safe-area-inset-top,0px)) + 8px);z-index:60;max-width:480px;margin:0 auto;background:var(--panel);color:var(--ink);border:2px solid var(--gold);border-radius:20px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:pushin .3s ease-out}
.push[hidden]{display:none}
.ov{position:fixed;inset:0;z-index:100;background:rgba(8,18,40,.78);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + var(--safe-area-inset-top,env(safe-area-inset-top,0px)));padding-bottom:calc(16px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)))}
.ov[hidden]{display:none}
.ov-hist{max-height:28vh;overflow:auto;margin:0 0 16px;-webkit-overflow-scrolling:touch}
.ov-hist table{width:100%}
.ov-hist th,.ov-hist td{padding:6px 4px;font-size:15px}
.ov-hist td.x,.ov-hist th:last-child,.ov-hist .empty{display:none}
#cf{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ov-card{position:relative;background:var(--panel);color:var(--ink);border:2px solid var(--gold);border-radius:28px;padding:26px 22px;text-align:center;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.ov-cup{font-size:64px;line-height:1;animation:bob 1.2s ease-in-out infinite}
.ov-card h2{font:800 30px/1.1 var(--font);margin:10px 0 6px}
.ov-s{font:700 18px var(--font);margin:0 0 4px}
.ov-r{color:var(--mute);margin:0 0 12px;font-size:15px}
.ov-btns{display:grid;gap:10px}
.ov-btns button{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:14px;font:700 16px var(--font);cursor:pointer}
.ov-btns button.pri{background:var(--btn);border-color:var(--btn);color:var(--btnink)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.intro{position:fixed;inset:0;z-index:200;background:#216932;display:flex;align-items:center;justify-content:center;transition:opacity .5s ease,visibility .5s}
.intro.out{opacity:0;visibility:hidden}
.intro-in{display:flex;flex-direction:column;align-items:center;gap:14px;}
.intro img{width:min(86vw,440px);height:auto;display:block;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 5%,#000 95%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 5%,#000 95%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent 0,#000 5%,#000 95%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 5%,#000 95%,transparent 100%);mask-composite:intersect;aspect-ratio:1/1;animation:introin .45s ease-out both,introbreath 2.2s cubic-bezier(.45,0,.55,1) both}
@keyframes introin{from{opacity:0}to{opacity:1}}
@keyframes introbreath{from{transform:scale(.975)}to{transform:scale(1.03)}}
@media (prefers-reduced-motion:reduce){.intro img{animation:none}}
.total.bump{animation:bump .6s ease;transform-origin:left center}
@keyframes bump{40%{transform:scale(1.15)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-8px) rotate(6deg)}}
@media (prefers-reduced-motion:reduce){.ov-card,.ov-cup{animation:none}}
.push b{display:block;font-size:17px}
.push span{color:var(--mute);font-size:14px}
@keyframes pushin{from{transform:translateY(-120%);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.push{animation:none}}
.seg3 button{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:10px 4px;font:700 14px var(--font);cursor:pointer;min-height:46px}
.seg3 button.on{background:var(--btn);border-color:var(--btn);color:var(--btnink)}
section{background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px}
h2{font:700 17px/1.2 var(--font);margin:0 0 12px}
label,.lab{display:block;font-size:13px;color:var(--mute);margin:0 0 6px 4px}
select,input.num{width:100%;font:700 20px var(--font);font-variant-numeric:tabular-nums;padding:11px 14px;border:2px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink)}
.row{margin-bottom:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:11px 8px;font:700 15px var(--font);cursor:pointer;min-height:46px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button.on.s0{background:var(--a);border-color:var(--a);color:#fff}
.seg button.on.s1{background:var(--gold);border-color:var(--gold);color:#1a1a1a}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sub{margin-top:12px;font-size:14px;color:var(--mute);text-align:center;min-height:21px}
.sub.fall{color:var(--warn);font-weight:700}
.go{width:100%;margin-top:12px;border:0;border-radius:99px;background:var(--btn);color:var(--btnink);font:700 17px var(--font);padding:15px;cursor:pointer}
.go:disabled{opacity:.4}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hist{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line);font-size:16px;font-weight:600}
th{font-weight:500;color:var(--mute);font-size:13px}
td small{display:block;color:var(--mute);font-size:11px;font-weight:400}
td small.f{color:var(--warn);font-weight:700}
td.r{color:var(--mute);width:28px;font-weight:400}
td.x button{border:0;background:none;color:var(--mute);font-size:20px;cursor:pointer;padding:4px 8px}
tr:last-child td{border-bottom:0}
.empty{color:var(--mute);font-size:14px;margin:0}
.foot{display:flex;gap:8px;margin-top:12px}
.foot button{flex:1;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:12px;font:600 15px var(--font);cursor:pointer}
</style>
</head>

<script>
(function(){
var TARGET=1001,WORDS=["байт","байток","байточок","байтік","баюшка"];
var S={names:["Ми","Ви"],rounds:[]};
var cur={size:162,cards:["",""],play:null};
try{var raw=localStorage.getItem("debertz2");if(raw){var p=JSON.parse(raw);if(p&&p.rounds)S=p;}}catch(e){}
function save(){try{localStorage.setItem("debertz2",JSON.stringify(S));}catch(e){}}
function $(id){return document.getElementById(id);}
if(S.target)TARGET=S.target;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function num(v){var n=parseInt(v,10);return isNaN(n)?0:n;}
function one(raw,size,pl,hang,mode,zero,byt){
  var op=1-pl,p=[raw[0],raw[1]],fell=false,hungNew=0,took=null,tie=raw[pl]===raw[op];
  if(raw[pl]<raw[op]){fell=true;p[pl]=0;p[op]=size;}
  else if(tie){mode=mode||"hang";if(mode==="hang"){p[pl]=0;hungNew=raw[pl];}else if(mode==="none"){p=[0,0];}}
  var left=hang;
  if(!tie&&hang>0){var w=p[0]>p[1]?0:1;p[w]+=hang;took={team:w,amt:hang};left=0;}
  var bA=[byt[0],byt[1]],pen=[0,0];
  if(fell){bA[pl]++;if(bA[pl]>=3){pen[pl]+=100;bA[pl]=0;}}
  for(var k=0;k<2;k++)if(raw[k]===0&&zero&&zero[k])pen[k]+=50;
  p[0]-=pen[0];p[1]-=pen[1];
  return {p:p,fell:fell,hungNew:hungNew,took:took,tie:tie,mode:mode,pen:pen,byt:bA,hang:left+hungNew};
}
function replay(){
  var hang=0,t=[0,0],out=[],byt=[0,0];
  S.rounds.forEach(function(r){var o=one(r.raw,r.size,r.play,hang,r.tie,r.z,byt);hang=o.hang;byt=o.byt;t[0]+=o.p[0];t[1]+=o.p[1];out.push(o);});
  return {t:t,hang:hang,out:out,byt:byt};
}
function totals(){return replay().t;}

var sz="";[162,182,202,212,222,232,242,252,262,272,282,292,302,312,322,332,342,352,362].forEach(function(v){sz+='<option value="'+v+'">'+v+'</option>';});
$("size").innerHTML=sz;

function renderBoard(){
  var RP0=replay(),t=RP0.t,h="";
  for(var i=0;i<2;i++){
    var pct=Math.max(0,Math.min(100,t[i]/TARGET*100)),left=Math.max(0,TARGET-t[i]);
    h+='<div class="team t'+i+'"><input class="name" data-i="'+i+'" value="'+esc(S.names[i])+'" aria-label="Назва команди '+(i+1)+'" maxlength="16">'
     +'<div class="total">'+t[i]+'</div><div class="bar"><i style="width:'+pct+'%"></i></div>'
     +'<div class="left">'+(left>0?'ще '+left:'ціль досягнуто')+(RP0.byt[i]?'<br>байти: '+RP0.byt[i]+'/3':'')+'</div></div>';
  }
  $("board").innerHTML=h;
  animTotals($("board"),LT['2'],t,TARGET,LTG['2']);LT['2']=t.slice();LTG['2']=TARGET;
  var hg=replay().hang,hl=$("hang");hl.hidden=!hg;hl.textContent=hg?"Висить "+hg+" — їх забере той, хто виграє наступну роздачу":"";
  var w=$("win");
  if(t[0]>=TARGET||t[1]>=TARGET){
    var win=t[0]===t[1]?-1:(t[0]>t[1]?0:1);
    w.hidden=false;
    w.textContent=win<0?"Нічия — грайте ще роздачу":"Перемагає «"+S.names[win]+"» — "+t[win]+" : "+t[1-win];
  }else w.hidden=true;
}

function renderPlay(){
  var h="";
  for(var i=0;i<2;i++)h+='<button class="s'+i+(cur.play===i?' on':'')+'" data-p="'+i+'" aria-pressed="'+(cur.play===i)+'">'+esc(S.names[i])+'</button>';
  $("play").innerHTML=h;
}
function renderEntry(){
  var h="";
  for(var i=0;i<2;i++)
    h+='<div>'
     +'<input class="num" id="c'+i+'" data-i="'+i+'" type="number" inputmode="numeric" min="0" max="'+cur.size+'" placeholder="0" aria-label="'+esc(S.names[i])+': очки" value="'+cur.cards[i]+'"></div>';
  $("entry").innerHTML=h;
  $("size").value=String(cur.size);renderSize(false);
  renderPlay();updateCheck();
}

function calc(){
  if(cur.cards[0]===""||cur.cards[1]==="")return null;
  var a=num(cur.cards[0]),b=num(cur.cards[1]);
  if(a+b!==cur.size||cur.play===null)return null;
  var rp=replay(),o=one([a,b],cur.size,cur.play,rp.hang,cur.tie,cur.z||[true,true],rp.byt);o.raw=[a,b];return o;
}
function updateCheck(){
  var c=$("chk"),btn=$("add");c.className="sub";renderTie();renderZero();
  var filled=cur.cards[0]!==""&&cur.cards[1]!=="";
  if(!filled){c.textContent="Введіть очки однієї команди — друга порахується сама";btn.disabled=true;return;}
  if(cur.play===null){c.textContent="Оберіть, хто грає";btn.disabled=true;return;}
  var r=calc();btn.disabled=!r;
  if(!r){c.textContent="Сума має бути "+cur.size;return;}
  if(r.fell){c.className="sub fall";c.textContent="Байт: «"+S.names[cur.play]+"» не набрали — «"+S.names[1-cur.play]+"» беруть усі "+cur.size;}
  else if(r.tie&&r.mode==="as")c.textContent="Порівну — очки рахуються як є: "+r.p[0]+" : "+r.p[1];
  else if(r.tie&&r.mode==="none")c.textContent="Порівну — роздача не рахується, очки не нараховуються";
  else if(r.hungNew)c.textContent="Висить: «"+S.names[cur.play]+"» не отримують "+r.hungNew+" — їх забере переможець наступної роздачі";
  else c.textContent="Рахунок роздачі: "+r.p[0]+" : "+r.p[1]+(r.took?" (з висячими "+r.took.amt+" для «"+S.names[r.took.team]+"»)":"");
}

function renderHist(){
  var r=S.rounds,RP=replay().out;
  if(!r.length){$("hist").innerHTML='<p class="empty">Поки порожньо. Запишіть першу роздачу.</p>';return;}
  var h='<table><tr><th></th><th>'+esc(S.names[0])+'</th><th>'+esc(S.names[1])+'</th><th></th></tr>';
  r.forEach(function(x,i){
    var o=RP[i],note=function(t){var s='';
      if(x.play===t)s=o.fell?'<small class="f">'+WORDS[x.w!==undefined?x.w:i%WORDS.length]+'</small>':(o.hungNew?'<small class="f">висить '+o.hungNew+'</small>':(o.tie&&o.mode==="none"?'<small class="f">не рахується</small>':'<small>грали</small>'));
      if(o.took&&o.took.team===t)s+='<small>+'+o.took.amt+' висяче</small>';
      var q=o.pen[t];if(q){s+='<small class="f">'+(q>=100?'3 байти −100':'')+(q%100===50?(q>=100?', ':'')+'без взяток −50':'')+'</small>';}return s;};
    h+='<tr><td class="r">'+(i+1)+'</td><td>'+o.p[0]+note(0)+'</td><td>'+o.p[1]+note(1)+'</td>'
     +'<td class="x"><button data-del="'+i+'" aria-label="Видалити роздачу '+(i+1)+'">×</button></td></tr>';
  });
  $("hist").innerHTML=h+'</table>';
}
function renderAll(){renderBoard();renderHist();renderBoard3();winHook();}

$("size").addEventListener("change",function(){
  cur.size=+this.value;
  var i=(cur.src===0||cur.src===1)&&cur.cards[cur.src]!==""?cur.src:(cur.cards[0]!==""?0:(cur.cards[1]!==""?1:-1));
  if(i>=0){var v=Math.min(num(cur.cards[i]),cur.size);cur.cards[i]=String(v);cur.cards[1-i]=String(cur.size-v);}
  renderEntry();
});
$("play").addEventListener("click",function(e){
  var b=e.target.closest("button[data-p]");if(!b)return;
  cur.play=+b.dataset.p;renderPlay();updateCheck();
});
$("entry").addEventListener("input",function(e){
  var el=e.target;if(!el.classList.contains("num"))return;
  var i=+el.dataset.i,o=1-i,v=el.value;
  if(v!==""&&num(v)>cur.size){v=String(cur.size);el.value=v;}
  cur.cards[i]=v;cur.src=v===""?null:i;
  cur.cards[o]=v===""?"":String(cur.size-num(v));
  $("c"+o).value=cur.cards[o];
  updateCheck();
});
$("add").addEventListener("click",function(){
  var r=calc();if(!r)return;
  S.rounds.push({raw:r.raw,size:cur.size,play:cur.play,tie:cur.tie||"hang",z:cur.z||[true,true],w:Math.floor(Math.random()*WORDS.length)});
  cur={size:162,cards:["",""],play:null};
  save();renderEntry();renderAll();
});
$("hist").addEventListener("click",function(e){
  var b=e.target.closest("button[data-del]");if(!b)return;
  S.rounds.splice(+b.dataset.del,1);save();renderAll();
});
$("board").addEventListener("input",function(e){
  var el=e.target;if(!el.classList.contains("name"))return;
  S.names[+el.dataset.i]=el.value||("Команда "+(+el.dataset.i+1));save();
});
$("board").addEventListener("change",function(){renderEntry();renderHist();});
$("undo").addEventListener("click",function(){S.rounds.pop();save();renderAll();});
$("reset").addEventListener("click",function(){
  if(S.rounds.length&&!ask(this,"Точно? Натисніть ще раз"))return;
  if(S.rounds.length)S.prev={rounds:S.rounds,names:S.names.slice()};S.rounds=[];cur={size:162,cards:["",""],play:null};save();renderEntry();renderAll();renderPrev();scrollTop();
});
function renderPrev(){var b=$("restore");b.hidden=!S.prev;if(S.prev)b.textContent="Повернути попередню партію ("+S.prev.rounds.length+" розд.)";}
$("restore").addEventListener("click",function(){
  if(!S.prev)return;
  if(S.rounds.length&&!ask(this,"Поточна стане попередньою — натисніть ще раз"))return;
  var pv=S.prev;S.prev=S.rounds.length?{rounds:S.rounds,names:S.names.slice()}:null;
  S.rounds=pv.rounds;S.names=pv.names;cur={size:162,cards:["",""],play:null};
  save();renderEntry();renderAll();renderPrev();
});
function ask(btn,msg){
  if(btn.dataset.armed){clearTimeout(btn._t);btn.dataset.armed="";btn.textContent=btn._old;return true;}
  btn._old=btn.textContent;btn.dataset.armed="1";btn.textContent=msg;
  btn._t=setTimeout(function(){btn.dataset.armed="";btn.textContent=btn._old;},4000);return false;
}
function renderTie(){
  var t=cur.cards[0]!==""&&cur.cards[1]!==""&&num(cur.cards[0])===num(cur.cards[1]);
  $("tierow").hidden=!t;if(!t)return;
  var m=cur.tie||"hang",h="";
  [["hang","Висить"],["as","Як є"],["none","Не рахувати"]].forEach(function(x){h+='<button data-t="'+x[0]+'" class="'+(m===x[0]?'on':'')+'">'+x[1]+'</button>';});
  $("tie").innerHTML=h;
}
function renderSize(open){
  $("ddb").innerHTML='<span>'+cur.size+'</span><span aria-hidden="true">▾</span>';
  $("ddb").setAttribute("aria-expanded",open?"true":"false");
  var l=$("ddl");l.hidden=!open;
  if(open){var h="";[162,182,202,212,222,232,242,252,262,272,282,292,302,312,322,332,342,352,362].forEach(function(v){h+='<button data-v="'+v+'" class="'+(v===cur.size?'on':'')+'">'+v+'</button>';});l.innerHTML=h;var on=l.querySelector('.on');if(on)l.scrollTop=Math.max(0,on.offsetTop-8);}
}
$("ddb").addEventListener("click",function(){renderSize($("ddl").hidden);});
$("ddl").addEventListener("click",function(e){var b=e.target.closest("button[data-v]");if(!b)return;var s=$("size");s.value=b.dataset.v;s.dispatchEvent(new Event("change"));});
document.addEventListener("click",function(e){if(!e.target.closest(".dd")&&!$("ddl").hidden)renderSize(false);});
function renderTarget(){
  var h="";[501,1001,2001,3001].forEach(function(v){h+='<button data-g="'+v+'" class="'+(v===TARGET?'on':'')+'">'+v+'</button>';});
  $("tgt").innerHTML=h;$("tg").textContent=TARGET;
}
$("tgt").addEventListener("click",function(e){var b=e.target.closest("button[data-g]");if(!b)return;TARGET=+b.dataset.g;S.target=TARGET;save();renderTarget();renderAll();});
function renderZero(){
  var h="";
  for(var i=0;i<2;i++){
    if(cur.cards[i]===""||num(cur.cards[i])!==0)continue;
    var z=(cur.z||[true,true])[i];
    h+='<span class="lab">«'+esc(S.names[i])+'»: 0 очок</span><div class="seg3 two" style="margin-bottom:10px"><button data-zi="'+i+'" data-z="1" class="'+(z?'on':'')+'">Без взяток −50</button><button data-zi="'+i+'" data-z="0" class="'+(z?'':'on')+'">Взятка з 0 балів</button></div>';
  }
  $("zerorow").hidden=!h;$("zerorow").innerHTML=h;
}
$("zerorow").addEventListener("click",function(e){var b=e.target.closest("button[data-zi]");if(!b)return;cur.z=cur.z||[true,true];cur.z[+b.dataset.zi]=b.dataset.z==="1";updateCheck();});
$("tie").addEventListener("click",function(e){var b=e.target.closest("button[data-t]");if(!b)return;cur.tie=b.dataset.t;renderTie();updateCheck();});
var S3={names:['Гравець 1','Гравець 2','Гравець 3'],rounds:[],fv:'equal'};
try{var q3=JSON.parse(localStorage.getItem('debertz3')||'null');if(q3&&q3.rounds)S3=q3;}catch(e){}
var MODE='2';try{MODE=localStorage.getItem('debanote_mode')||'2';}catch(e){}
var SZ=[162,182,202,212,222,232,242,252,262,272,282,292,302,312,322,332,342,352,362];
var c3={size:162,cards:['','',''],play:null,auto:null};
var g=function(i){return document.getElementById(i);};
function e3(s){return esc(s).replace(/'/g,'&#39;');}
function save3(){try{localStorage.setItem('debertz3',JSON.stringify(S3));}catch(e){}}
var FVH={equal:'Очки граючого діляться порівну між двома іншими.',leader:'Очки граючого отримує той із двох, хто набрав більше.',total:'Усі очки роздачі діляться між двома іншими пропорційно їхнім очкам.'};
function one3(raw,size,pl,fv,mode,hang,byt,zero){
  mode=mode||'hang';
  var X=pl===0?1:0,Y=pl===2?1:2,x=raw[X],y=raw[Y],d=raw[pl],mx=Math.max(x,y);
  var p=raw.slice(),fell=d<mx,tie=d===mx,hungNew=0,took=null,pen=[0,0,0],bA=byt.slice();
  if(fell){
    if(fv==='leader'){p[x>=y?X:Y]+=d;}
    else if(fv==='total'){var s=x+y;p[X]=Math.round(size*x/s);p[Y]=size-p[X];}
    else{var h=Math.floor(d/2),L=x>=y?X:Y;p[L]+=d-h;p[L===X?Y:X]+=h;}
    p[pl]=0;bA[pl]++;if(bA[pl]>=3){pen[pl]=100;bA[pl]=0;}
  }else if(tie){
    if(mode==='none')p=[0,0,0];else if(mode!=='as'){p[pl]=0;hungNew=d;}
  }
  var left=hang;
  if(!tie&&hang>0){var w=0;for(var i=1;i<3;i++)if(p[i]>p[w])w=i;p[w]+=hang;took={team:w,amt:hang};left=0;}
  for(var k=0;k<3;k++)if(raw[k]===0&&zero&&zero[k])pen[k]+=50;
  p=p.map(function(v,i){return v-pen[i];});
  return {p:p,fell:fell,hungNew:hungNew,took:took,tie:tie,mode:mode,pen:pen,byt:bA,hang:left+hungNew};
}
function replay3(){
  var hang=0,t=[0,0,0],out=[],byt=[0,0,0];
  S3.rounds.forEach(function(r){var o=one3(r.raw,r.size,r.play,S3.fv,r.tie,hang,byt,r.z);hang=o.hang;byt=o.byt;for(var i=0;i<3;i++)t[i]+=o.p[i];out.push(o);});
  return {t:t,hang:hang,out:out,byt:byt};
}
function isTie3(){
  var c=c3.cards;if(c3.play===null||c.some(function(v){return v==='';}))return false;
  var a=c.map(num);if(a[0]+a[1]+a[2]!==c3.size)return false;
  var o=[0,1,2].filter(function(k){return k!==c3.play;});
  return a[c3.play]===Math.max(a[o[0]],a[o[1]]);
}
function calc3(){
  var c=c3.cards;if(c.some(function(v){return v==='';})||c3.play===null)return null;
  var a=c.map(num);if(a[0]+a[1]+a[2]!==c3.size)return null;
  var R=replay3(),o=one3(a,c3.size,c3.play,S3.fv,c3.tie,R.hang,R.byt,c3.z||[true,true,true]);o.raw=a;return o;
}
function fill3(){
  var c=c3.cards,a=c3.auto;
  if(a!==null){
    var o=[0,1,2].filter(function(k){return k!==a;});
    if(c[o[0]]!==''&&c[o[1]]!==''){var r=c3.size-num(c[o[0]])-num(c[o[1]]);c[a]=r>=0?String(r):'';}else{c[a]='';c3.auto=null;}
    return;
  }
  var em=[0,1,2].filter(function(k){return c[k]==='';});
  if(em.length===1){var o2=[0,1,2].filter(function(k){return k!==em[0];});var r2=c3.size-num(c[o2[0]])-num(c[o2[1]]);if(r2>=0){c[em[0]]=String(r2);c3.auto=em[0];}}
}
function renderBoard3(){
  var R=replay3(),h='',mx=Math.max.apply(null,R.t);
  for(var i=0;i<3;i++){
    var pct=Math.max(0,Math.min(100,R.t[i]/TARGET*100)),left=Math.max(0,TARGET-R.t[i]);
    h+=`<div class='team t${i}'><input class='name' data-i='${i}' value='${e3(S3.names[i])}' aria-label='Ім’я гравця ${i+1}' maxlength='14'><div class='total'>${R.t[i]}</div><div class='bar'><i style='width:${pct}%'></i></div><div class='left'>${left>0?'ще '+left:'ціль досягнуто'}${R.byt[i]?'<br>байти: '+R.byt[i]+'/3':''}</div></div>`;
  }
  g('board3').innerHTML=h;
  animTotals(g('board3'),LT['3'],R.t,TARGET,LTG['3']);LT['3']=R.t.slice();LTG['3']=TARGET;
  var w=g('win3');
  if(mx>=TARGET){var best=[0,1,2].filter(function(i){return R.t[i]===mx;});w.hidden=false;w.textContent=best.length>1?'Нічия — грайте ще роздачу':`Перемагає «${S3.names[best[0]]}» — ${mx}`;}else w.hidden=true;
  var hl=g('hang3');hl.hidden=!R.hang;hl.textContent=R.hang?`Висить ${R.hang} — їх забере той, хто виграє наступну роздачу`:'';
}
function renderFv(){
  var lock=S3.rounds.length>0,h='';
  [['equal','Порівну'],['leader','Лідеру'],['total','Між двома']].forEach(function(o){h+=`<button data-f='${o[0]}' class='${S3.fv===o[0]?'on':''}' ${lock?'disabled':''}>${o[1]}</button>`;});

function confetti(){

function pctOf(v,tg){return Math.max(0,Math.min(100,v/tg*100));}

function animTotals(root,prev,next,tg,tgPrev){
  if(!prev||noMotion())return;
  var cards=root.querySelectorAll('.team');
  for(var i=0;i<cards.length;i++){(function(c,from,to,p0,p1){
    if(from===to&&p0===p1)return;
    var tot=c.querySelector('.total'),bar=c.querySelector('.bar i');
    bar.style.transition='none';bar.style.width=p0+'%';tot.textContent=from;
    void bar.offsetWidth;
    setTimeout(function(){
      bar.style.transition='';bar.style.width=p1+'%';
      if(from!==to)tot.classList.add('bump');
      var t0=performance.now(),dur=1000;
      (function st(now){var k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);tot.textContent=Math.round(from+(to-from)*e);if(k<1)requestAnimationFrame(st);else tot.textContent=to;})(t0);
    },300);
  })(cards[i],prev[i],next[i],pctOf(prev[i],tgPrev),pctOf(next[i],tg));}
}
